[package]
name = "authorisationkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Nikita Patskov <patskovn@yahoo.com>"]
description = "Rust SDK for the Authorisationkit API: HTTP client and JWT verifier."
license = "MIT OR Apache-2.0"
repository = "https://github.com/authorisationkit/sdk-rust"
homepage = "https://github.com/authorisationkit/sdk-rust"
documentation = "https://docs.rs/authorisationkit"
readme = "README.md"
keywords = ["authorisation", "auth", "oauth", "jwt", "sdk"]
categories = ["authentication", "api-bindings"]
include = ["src/**/*.rs", "README.md", "CHANGELOG.md"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
reqwest-retry = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
jsonwebtoken = "9"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
base64 = "0.22"
futures = "0.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
