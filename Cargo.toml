[package]
name = "authorisationkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nikita Patskov <patskovn@yahoo.com>"]
description = "Rust SDK for the Authorisationkit API: HTTP client and JWT verifier."
license = "MIT OR Apache-2.0"
repository = "https://github.com/authorisationkit/sdk-rust"
homepage = "https://github.com/authorisationkit/sdk-rust"
documentation = "https://docs.rs/authorisationkit"
readme = "README.md"
keywords = ["authorisation", "auth", "oauth", "jwt", "sdk"]
categories = ["authentication", "api-bindings"]
include = ["src/**/*.rs", "build.rs", "openapi.json", "README.md", "CHANGELOG.md"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
progenitor-client = "0.14"
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
jsonwebtoken = "9"
thiserror = "2"
tracing = "0.1"

[build-dependencies]
progenitor = "0.14"
openapiv3 = "2"
serde_json = "1"
quote = "1"
syn = "2"
prettyplease = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
base64 = "0.22"
futures = "0.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
